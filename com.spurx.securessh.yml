app-id: com.spurx.securessh
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: spurx-secure-ssh

finish-args:
  # UI & Display
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --device=dri

  # Network for SSH connections & AI APIs
  - --share=network

  # Sound
  - --socket=pulseaudio

  # Filesystem access for SSH keys, configs, logs, downloads, and SFTP file browsing
  - --filesystem=home
  - --filesystem=host
  - --filesystem=xdg-config/gtk-3.0:ro
  - --filesystem=xdg-config/kdeglobals:ro
  - --filesystem=xdg-data/themes:ro
  - --filesystem=~/.themes:ro

  # System Keyring / Master Password DBus access
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.FdoStyle
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=org.freedesktop.portal.Settings
  - --talk-name=org.freedesktop.Notifications

  # Dark GTK theme preference for window decorations
  - --env=GTK_THEME=Adwaita:dark

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/spurx-secure-ssh/cargo

modules:
  - name: spurx-secure-ssh
    buildsystem: simple
    build-commands:
      - cargo build --release
      - mkdir -p /app/bin /app/share/applications /app/share/icons/hicolor/512x512/apps
      - cp target/release/spurx-secure-ssh /app/bin/
      - cp assets/icon_512x512.png /app/share/icons/hicolor/512x512/apps/com.spurx.securessh.png
      - |
        cat <<EOF > /app/share/applications/com.spurx.securessh.desktop
        [Desktop Entry]
        Name=SpurX Secure SSH
        Comment=A Modern Slint-based SSH Client
        Exec=spurx-secure-ssh
        Icon=com.spurx.securessh
        Type=Application
        Categories=Network;Utility;
        Terminal=false
        EOF
    sources:
      - type: dir
        path: .
