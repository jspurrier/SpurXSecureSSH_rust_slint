app-id: com.spurx.securessh
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
  - org.freedesktop.Sdk.Extension.rust-stable

command: spurx-secure-ssh

finish-args:
  # UI
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  # Network for SSH connections
  - --share=network
  # Sound (if terminal bell/beeps are used)
  - --socket=pulseaudio
  # Filesystem access for SSH keys and SFTP
  - --filesystem=host

build-options:
  append-path: /usr/lib/sdk/node20/bin:/usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/spurx-secure-ssh/cargo

modules:
  - name: spurx-secure-ssh
    buildsystem: simple
    build-commands:
      # Install Node dependencies offline using the generated sources
      - npm ci
      # Build the application
      - npm run tauri build -- --bundles appimage
      # Extract the built executable and assets
      - mkdir -p /app/bin /app/share/applications /app/share/icons/hicolor/128x128/apps
      # Assuming tauri outputs the executable here
      - cp src-tauri/target/release/spurx-secure-ssh /app/bin/
      # Install icons
      - cp icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.spurx.securessh.png
      # Create a simple desktop file
      - |
        cat <<EOF > /app/share/applications/com.spurx.securessh.desktop
        [Desktop Entry]
        Name=SpurX Secure SSH
        Exec=spurx-secure-ssh
        Icon=com.spurx.securessh
        Type=Application
        Categories=Network;Utility;
        EOF
    sources:
      - type: dir
        path: .
      - cargo-sources.json
