name: Release
on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon (M1/M2/M3)
            args: "--target aarch64-apple-darwin"
            targetName: "aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: "--target x86_64-unknown-linux-gnu --bundles appimage,deb,rpm"
            targetName: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
            targetName: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev rpm libfuse2 libsoup-3.0-dev

      - name: install rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || '' }}

      - name: install frontend dependencies
        run: npm install

      - name: build tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: upload release assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        with:
          repository: jspurrier/SpurXSecureSSH_rust_Public
          draft: false
          prerelease: false
          files: |
            src-tauri/target/${{ matrix.targetName }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.targetName }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.targetName }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.targetName }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.targetName }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.targetName }}/release/bundle/msi/*.msi

  sync-docs:
    needs: publish-tauri
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      
      - name: Prepare User Guide
        run: |
          mkdir public_docs
          cp README.md public_docs/UserGuide.md

      - name: Push User Guide to Public Repo
        uses: cpina/github-action-push-to-another-repository@v1.7.3
        env:
          API_TOKEN_GITHUB: ${{ secrets.PUBLIC_REPO_TOKEN }}
        with:
          source-directory: 'public_docs'
          destination-github-username: 'jspurrier'
          destination-repository-name: 'SpurXSecureSSH_rust_Public'
          user-email: 'github-actions[bot]@users.noreply.github.com'
          target-branch: 'master'
          commit-message: 'Update User Guide from ${{ github.ref_name }}'




  build-flatpak:
    needs: publish-tauri
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Generators
        run: |
          pip install aiohttp toml flatpak-node-generator
          wget https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          
      - name: Generate Dependencies
        run: |
          python3 flatpak-cargo-generator.py src-tauri/Cargo.lock -o cargo-sources.json
          flatpak-node-generator npm package-lock.json -o node-sources.json
          
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: spurx-secure-ssh.flatpak
          manifest-path: com.spurx.securessh.yml
          cache-key: flatpak-builder-${{ github.sha }}
          
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        with:
          repository: jspurrier/SpurXSecureSSH_rust_Public
          files: spurx-secure-ssh.flatpak
