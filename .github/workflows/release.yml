name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon (M1/M2/M3)
            args: "--target aarch64-apple-darwin"
            targetName: "aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: "--bundles appimage,deb,rpm"
            targetName: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            targetName: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev rpm libfuse2 libsoup-3.0-dev

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || '' }}

      - name: install frontend dependencies
        run: npm install

      - name: build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }} # Removed as key has no password
        with:
          tagName: v__VERSION__ # the action automatically replaces this
          releaseName: 'SpurX Secure SSH v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: locate and rename updater json
        shell: bash
        run: |
          TARGET="${{ matrix.targetName }}"
          
          echo "Looking for latest.json for target: $TARGET"
          find src-tauri/target -name "latest.json" -type f -exec cp {} latest-${TARGET}.json \; || echo "No latest.json found"
          
          if [ -f "latest-${TARGET}.json" ]; then
            echo "Found and renamed to latest-${TARGET}.json"
            cat latest-${TARGET}.json
          else
            echo "Error: latest-${TARGET}.json not found."
            exit 1
          fi

      - name: upload updater json
        uses: actions/upload-artifact@v4
        with:
          name: updater-json-${{ matrix.targetName }}
          path: latest-${{ matrix.targetName }}.json
          retention-days: 1

  update-manifests:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updaters
          fetch-depth: 0
        continue-on-error: true

      - name: configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Initialize branch if checkout failed
          git checkout updaters 2>/dev/null || git checkout -b updaters

      - name: download updater jsons
        uses: actions/download-artifact@v4
        with:
          pattern: updater-json-*
          merge-multiple: true

      - name: commit and push
        run: |
          git add latest-*.json
          git commit -m "chore: update release manifests" || echo "No changes to commit"
          git push origin updaters
