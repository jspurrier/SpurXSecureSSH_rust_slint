name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # Windows Build (x86_64)
  # ==========================================
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v2.0.0" }
          $outDir = "dist-windows"
          New-Item -ItemType Directory -Path $outDir -Force
          Copy-Item "target/release/spurx-secure-ssh.exe" -Destination "$outDir/"
          Copy-Item "README.md" -Destination "$outDir/"
          Copy-Item "LICENSE" -Destination "$outDir/"
          Compress-Archive -Path "$outDir/*" -DestinationPath "spurx-secure-ssh-${tag}-windows-x86_64.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spurx-secure-ssh-windows
          path: spurx-secure-ssh-*-windows-x86_64.zip

  # ==========================================
  # macOS Build (Universal / Apple Silicon & Intel)
  # ==========================================
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build for Apple Silicon (aarch64)
        run: cargo build --release --target aarch64-apple-darwin --locked

      - name: Build for Intel (x86_64)
        run: cargo build --release --target x86_64-apple-darwin --locked

      - name: Create Universal Binary & App Bundle
        run: |
          TAG="${GITHUB_REF_NAME:-v2.0.0}"
          mkdir -p target/universal/release
          lipo -create -output target/universal/release/spurx-secure-ssh \
            target/aarch64-apple-darwin/release/spurx-secure-ssh \
            target/x86_64-apple-darwin/release/spurx-secure-ssh

          APP_DIR="SpurX Secure SSH.app"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"
          cp target/universal/release/spurx-secure-ssh "${APP_DIR}/Contents/MacOS/spurx-secure-ssh"
          chmod +x "${APP_DIR}/Contents/MacOS/spurx-secure-ssh"
          cp assets/icon.icns "${APP_DIR}/Contents/Resources/icon.icns" || true

          cat << 'EOF' > "${APP_DIR}/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>spurx-secure-ssh</string>
              <key>CFBundleIconFile</key>
              <string>icon.icns</string>
              <key>CFBundleIdentifier</key>
              <string>com.spurx.securessh</string>
              <key>CFBundleName</key>
              <string>SpurX Secure SSH</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>2.0.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          tar -czvf "spurx-secure-ssh-${TAG}-macos-universal.tar.gz" "${APP_DIR}"

          # Create DMG image if hdiutil is available
          if command -v hdiutil &> /dev/null; then
            mkdir -p dmg_root
            cp -r "${APP_DIR}" dmg_root/
            ln -s /Applications dmg_root/Applications
            hdiutil create -volname "SpurX Secure SSH" -srcfolder dmg_root -ov -format UDZO "spurx-secure-ssh-${TAG}-macos-universal.dmg"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spurx-secure-ssh-macos
          path: |
            spurx-secure-ssh-*-macos-universal.tar.gz
            spurx-secure-ssh-*-macos-universal.dmg

  # ==========================================
  # Linux Builds (.tar.gz, .deb, .rpm, .AppImage)
  # ==========================================
  build-linux:
    name: Build Linux Packages (.tar.gz, .deb, .rpm, .AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            rpm \
            file \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Linux tar.gz
        run: |
          TAG="${GITHUB_REF_NAME:-v2.0.0}"
          PKG_DIR="spurx-secure-ssh-linux-x86_64"
          mkdir -p "${PKG_DIR}"
          cp target/release/spurx-secure-ssh "${PKG_DIR}/"
          cp README.md LICENSE "${PKG_DIR}/"
          cp assets/icon_512x512.png "${PKG_DIR}/icon.png"
          tar -czvf "spurx-secure-ssh-${TAG}-linux-x86_64.tar.gz" "${PKG_DIR}"

      - name: Package Debian (.deb)
        run: |
          TAG="${GITHUB_REF_NAME:-v2.0.0}"
          VERSION="${TAG#v}"
          DEB_ROOT="deb_root"
          mkdir -p "${DEB_ROOT}/usr/bin"
          mkdir -p "${DEB_ROOT}/usr/share/applications"
          mkdir -p "${DEB_ROOT}/usr/share/icons/hicolor/512x512/apps"
          mkdir -p "${DEB_ROOT}/DEBIAN"

          cp target/release/spurx-secure-ssh "${DEB_ROOT}/usr/bin/"
          chmod 755 "${DEB_ROOT}/usr/bin/spurx-secure-ssh"
          cp assets/icon_512x512.png "${DEB_ROOT}/usr/share/icons/hicolor/512x512/apps/com.spurx.securessh.png"

          cat << EOF > "${DEB_ROOT}/usr/share/applications/com.spurx.securessh.desktop"
          [Desktop Entry]
          Name=SpurX Secure SSH
          Comment=A Modern Slint-based SSH Client
          Exec=/usr/bin/spurx-secure-ssh
          Icon=com.spurx.securessh
          Type=Application
          Categories=Network;Utility;
          Terminal=false
          EOF

          cat << EOF > "${DEB_ROOT}/DEBIAN/control"
          Package: spurx-secure-ssh
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: John Spurrier
          Description: SpurX Secure SSH - A Modern Slint-based SSH Client
           A high-performance, native SSH client built with Rust and Slint.
          EOF

          dpkg-deb --build "${DEB_ROOT}" "spurx-secure-ssh_${VERSION}_amd64.deb"

      - name: Package Red Hat / Fedora (.rpm)
        run: |
          TAG="${GITHUB_REF_NAME:-v2.0.0}"
          VERSION="${TAG#v}"
          RPM_ROOT="${HOME}/rpmbuild"
          mkdir -p "${RPM_ROOT}/BUILD" "${RPM_ROOT}/RPMS" "${RPM_ROOT}/SOURCES" "${RPM_ROOT}/SPECS" "${RPM_ROOT}/SRPMS"

          cat << EOF > "${RPM_ROOT}/SPECS/spurx-secure-ssh.spec"
          Name:           spurx-secure-ssh
          Version:        ${VERSION}
          Release:        1%{?dist}
          Summary:        SpurX Secure SSH - A Modern Slint-based SSH Client
          License:        MIT
          URL:            https://github.com/jspurrier/SpurXSecureSSH_rust_slint

          %description
          SpurX Secure SSH is a modern, cross-platform SSH client built with Rust and Slint.

          %install
          mkdir -p %{buildroot}%{_bindir}
          mkdir -p %{buildroot}%{_datadir}/applications
          mkdir -p %{buildroot}%{_datadir}/icons/hicolor/512x512/apps

          install -m 755 ${GITHUB_WORKSPACE}/target/release/spurx-secure-ssh %{buildroot}%{_bindir}/spurx-secure-ssh
          install -m 644 ${GITHUB_WORKSPACE}/assets/icon_512x512.png %{buildroot}%{_datadir}/icons/hicolor/512x512/apps/com.spurx.securessh.png

          cat << 'DESK' > %{buildroot}%{_datadir}/applications/com.spurx.securessh.desktop
          [Desktop Entry]
          Name=SpurX Secure SSH
          Comment=A Modern Slint-based SSH Client
          Exec=spurx-secure-ssh
          Icon=com.spurx.securessh
          Type=Application
          Categories=Network;Utility;
          Terminal=false
          DESK

          %files
          %{_bindir}/spurx-secure-ssh
          %{_datadir}/applications/com.spurx.securessh.desktop
          %{_datadir}/icons/hicolor/512x512/apps/com.spurx.securessh.png
          EOF

          rpmbuild -bb "${RPM_ROOT}/SPECS/spurx-secure-ssh.spec"
          cp ${RPM_ROOT}/RPMS/x86_64/*.rpm "spurx-secure-ssh-${VERSION}-1.x86_64.rpm"

      - name: Package AppImage
        run: |
          TAG="${GITHUB_REF_NAME:-v2.0.0}"
          VERSION="${TAG#v}"
          APP_DIR="AppDir"
          mkdir -p "${APP_DIR}/usr/bin"
          mkdir -p "${APP_DIR}/usr/share/applications"
          mkdir -p "${APP_DIR}/usr/share/icons/hicolor/512x512/apps"

          cp target/release/spurx-secure-ssh "${APP_DIR}/usr/bin/"
          cp assets/icon_512x512.png "${APP_DIR}/usr/share/icons/hicolor/512x512/apps/com.spurx.securessh.png"
          cp assets/icon_512x512.png "${APP_DIR}/com.spurx.securessh.png"
          cp assets/icon_512x512.png "${APP_DIR}/.DirIcon"

          cat << 'EOF' > "${APP_DIR}/com.spurx.securessh.desktop"
          [Desktop Entry]
          Name=SpurX Secure SSH
          Comment=A Modern Slint-based SSH Client
          Exec=spurx-secure-ssh
          Icon=com.spurx.securessh
          Type=Application
          Categories=Network;Utility;
          Terminal=false
          EOF
          cp "${APP_DIR}/com.spurx.securessh.desktop" "${APP_DIR}/usr/share/applications/"

          cat << 'EOF' > "${APP_DIR}/AppRun"
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/spurx-secure-ssh" "$@"
          EOF
          chmod +x "${APP_DIR}/AppRun"

          # Download appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ./squashfs-root/AppRun "${APP_DIR}" "spurx-secure-ssh-${TAG}-x86_64.AppImage"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spurx-secure-ssh-linux
          path: |
            spurx-secure-ssh-*-linux-x86_64.tar.gz
            spurx-secure-ssh_*.deb
            spurx-secure-ssh-*.rpm
            spurx-secure-ssh-*.AppImage

  # ==========================================
  # Flatpak Build
  # ==========================================
  build-flatpak:
    name: Build Linux Flatpak
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        continue-on-error: true
        with:
          bundle: spurx-secure-ssh.flatpak
          manifest-path: com.spurx.securessh.yml
          module-name: spurx-secure-ssh
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: spurx-secure-ssh-flatpak
          path: spurx-secure-ssh.flatpak

  # ==========================================
  # Publish Release (Triggered on v* tags)
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux, build-flatpak]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v') && !cancelled()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Display release artifacts
        run: |
          mkdir -p release-artifacts
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() || always()
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
